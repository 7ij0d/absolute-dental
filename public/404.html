<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Absolute Dental Equipment</title>
  <script>
    var l = window.location;
    var isSubfolder = l.hostname.endsWith('github.io');
    var segmentCount = isSubfolder ? 1 : 0;
    var basePath = l.pathname.split('/').slice(0, 1 + segmentCount).join('/');
    var route = '/' + l.pathname.slice(1).split('/').slice(segmentCount).join('/');
    // Instantly redirect directly into HashRouter route
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      basePath + '/#' + route + (l.search ? l.search : '')
    );
  </script>
</head>
<body></body>
</html>
